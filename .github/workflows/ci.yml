name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:tron-plugin
      - run: npm run check:english
      - run: npm run test:templates
      - run: npm run test:hardhat3
      - run: npm run pack:check

  hardhat3-supported-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.13.0, 26.0.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:hardhat3

  hardhat3-tron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22.13.0, 24.22.1, 26.0.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run tre:build-jar
      - run: npm run test:hardhat3:tron-plugin
      - run: npm run test:hardhat3:tron-template

  minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 20.11.0
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run test:runtime

  windows-toolchain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/toolchain.test.js test/process.test.js
      - run: npm run pack:check
